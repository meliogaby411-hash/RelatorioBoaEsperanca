<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Relatórios e Recibos em Tempo Real</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Cabeçalho -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-6 rounded-xl border border-slate-700">
      <div>
        <h1 class="text-2xl font-bold text-white">Painel de Recibos & Pagamentos</h1>
        <p class="text-slate-400 text-sm">Controle financeiro e upload de comprovativos em tempo real</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-3">
        <button onclick="exportarCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition">
          Exportar Relatório (CSV)
        </button>
        <button onclick="limparDados()" class="bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 px-4 py-2 rounded-lg text-sm font-medium transition">
          Limpar Tudo
        </button>
      </div>
    </div>

    <!-- Cartões de Resumo em Tempo Real -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Total Pago (Acumulado)</span>
        <div id="totalGeral" class="text-3xl font-bold text-emerald-400 mt-1">0,00 MT</div>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Recibos Registrados</span>
        <div id="totalRecibos" class="text-3xl font-bold text-blue-400 mt-1">0</div>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Maior Categoria de Gasto</span>
        <div id="maiorCategoria" class="text-xl font-bold text-amber-400 mt-2">—</div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Formulário de Upload de Recibo -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
        <h2 class="text-lg font-semibold mb-4 text-white">Novo Pagamento / Recibo</h2>
        <form id="formRecibo" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Foto ou PDF do Recibo</label>
            <input type="file" id="arquivoRecibo" accept="image/*,.pdf" required
              class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer bg-slate-900 rounded-lg p-1.5 border border-slate-700">
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1">Fornecedor / Descrição</label>
            <input type="text" id="descricao" placeholder="Ex: Compra de Telas LCD / Fornecedor" required
              class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Valor (MT)</label>
              <input type="number" id="valor" step="0.01" placeholder="0.00" required
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Data</label>
              <input type="date" id="dataPagamento" required
                class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-slate-400 mb-1">Categoria</label>
              <select id="categoria" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <option value="Peças & Componentes">Peças & Componentes</option>
                <option value="Equipamentos & Ferramentas">Equipamentos & Ferramentas</option>
                <option value="Logística & Envio">Logística & Envio</option>
                <option value="Serviços & Operações">Serviços & Operações</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Via de Pagamento</label>
              <select id="metodo" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                <option value="M-Pesa">M-Pesa</option>
                <option value="e-Mola">e-Mola</option>
                <option value="Transferência / POS">Transferência / POS</option>
                <option value="Cartão Internacional">Cartão Internacional</option>
                <option value="Numerário">Numerário</option>
              </select>
            </div>
          </div>

          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition">
            Registrar Recibo em Tempo Real
          </button>
        </form>
      </div>

      <!-- Tabela de Relatório em Tempo Real -->
      <div class="lg:col-span-2 bg-slate-800 p-6 rounded-xl border border-slate-700 overflow-hidden">
        <h2 class="text-lg font-semibold mb-4 text-white">Histórico de Pagamentos e Comprovativos</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700 text-slate-400 text-xs uppercase">
                <th class="py-3 px-2">Data</th>
                <th class="py-3 px-2">Descrição</th>
                <th class="py-3 px-2">Categoria</th>
                <th class="py-3 px-2">Método</th>
                <th class="py-3 px-2 text-right">Valor</th>
                <th class="py-3 px-2 text-center">Recibo</th>
              </tr>
            </thead>
            <tbody id="tabelaCorpo" class="divide-y divide-slate-700/60 text-sm"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para visualizar a foto do recibo -->
  <div id="modalRecibo" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="fecharModal()">
    <div class="bg-slate-800 p-4 rounded-xl max-w-lg w-full border border-slate-700" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-3">
        <h3 id="modalTitulo" class="font-semibold text-white">Comprovativo</h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>
      <img id="modalImagem" src="" alt="Recibo" class="w-full max-h-[70vh] object-contain rounded-lg bg-slate-900">
    </div>
  </div>

  <script>
    let recibos = JSON.parse(localStorage.getItem('recibos_realtime') || '[]');
    document.getElementById('dataPagamento').valueAsDate = new Date();

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString('pt-MZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MT';
    }

    function atualizarPainel() {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = '';
      let somaTotal = 0;
      const somaCategorias = {};

      recibos.slice().reverse().forEach((item, index) => {
        somaTotal += Number(item.valor);
        somaCategorias[item.categoria] = (somaCategorias[item.categoria] || 0) + Number(item.valor);

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-700/30 transition';
        tr.innerHTML = `
          <td class="py-3 px-2 text-slate-300 whitespace-nowrap">${item.data}</td>
          <td class="py-3 px-2 font-medium text-white">${item.descricao}</td>
          <td class="py-3 px-2"><span class="bg-slate-700 text-slate-200 px-2 py-1 rounded text-xs">${item.categoria}</span></td>
          <td class="py-3 px-2 text-slate-300">${item.metodo}</td>
          <td class="py-3 px-2 text-right font-semibold text-emerald-400 whitespace-nowrap">${formatarMoeda(item.valor)}</td>
          <td class="py-3 px-2 text-center">
            ${item.imagem ? `<button onclick="verRecibo(${recibos.length - 1 - index})" class="text-blue-400 hover:underline text-xs">Ver Foto</button>` : '<span class="text-slate-500 text-xs">PDF/Anexo</span>'}
          </td>
        `;
        corpo.appendChild(tr);
      });

      document.getElementById('totalGeral').textContent = formatarMoeda(somaTotal);
      document.getElementById('totalRecibos').textContent = recibos.length;

      let topCat = '—';
      let maxVal = 0;
      for (const [cat, val] of Object.entries(somaCategorias)) {
        if (val > maxVal) { maxVal = val; topCat = `${cat} (${formatarMoeda(val)})`; }
      }
      document.getElementById('maiorCategoria').textContent = topCat;
    }

    document.getElementById('formRecibo').addEventListener('submit', function(e) {
      e.preventDefault();
      const arquivo = document.getElementById('arquivoRecibo').files[0];
      const leitor = new FileReader();

      leitor.onload = function(evento) {
        const novoRecibo = {
          descricao: document.getElementById('descricao').value,
          valor: parseFloat(document.getElementById('valor').value),
          data: document.getElementById('dataPagamento').value,
          categoria: document.getElementById('categoria').value,
          metodo: document.getElementById('metodo').value,
          nomeArquivo: arquivo ? arquivo.name : 'Sem anexo',
          imagem: arquivo && arquivo.type.startsWith('image/') ? evento.target.result : null
        };

        recibos.push(novoRecibo);
        localStorage.setItem('recibos_realtime', JSON.stringify(recibos));
        atualizarPainel();
        document.getElementById('formRecibo').reset();
        document.getElementById('dataPagamento').valueAsDate = new Date();
      };

      if (arquivo) { leitor.readAsDataURL(arquivo); }
    });

    function verRecibo(idx) {
      const item = recibos[idx];
      if (!item || !item.imagem) return;
      document.getElementById('modalTitulo').textContent = `${item.descricao} - ${formatarMoeda(item.valor)}`;
      document.getElementById('modalImagem').src = item.imagem;
      document.getElementById('modalRecibo').classList.remove('hidden');
      document.getElementById('modalRecibo').classList.add('flex');
    }

    function fecharModal() {
      document.getElementById('modalRecibo').classList.add('hidden');
      document.getElementById('modalRecibo').classList.remove('flex');
    }

    function exportarCSV() {
      if (!recibos.length) return alert('Nenhum recibo registrado ainda.');
      let csv = 'Data,Descricao,Categoria,Metodo,Valor(MT),Arquivo\n';
      recibos.forEach(r => {
        csv += `"${r.data}","${r.descricao}","${r.categoria}","${r.metodo}",${r.valor},"${r.nomeArquivo}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'relatorio_pagamentos.csv';
      link.click();
    }

    function limparDados() {
      if (confirm('Deseja apagar todos os recibos salvos?')) {
        recibos = [];
        localStorage.removeItem('recibos_realtime');
        atualizarPainel();
      }
    }

    atualizarPainel();
  </script>
</body>
</html>
